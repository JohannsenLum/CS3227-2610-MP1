plugins {
    id 'application'
    id 'checkstyle'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'constella'
version = '0.1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

javafx {
    version = '25.0.2'
    modules = ['javafx.controls']
}

application {
    mainClass = 'constella.Launcher'
    applicationDefaultJvmArgs = ['--enable-native-access=javafx.graphics']
}

configurations {
    universalJavafxLinux
    universalJavafxWindows
    universalJavafxMac
}

checkstyle {
    toolVersion = '14.0.0'
    configFile = file('config/checkstyle/checkstyle.xml')
}

tasks.withType(Checkstyle).configureEach {
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.register('releaseJar', Jar) {
    group = 'distribution'
    description = 'Builds one JAR with Windows, Linux, and Apple Silicon macOS JavaFX natives bundled.'
    dependsOn classes
    archiveFileName = 'Constella.jar'
    destinationDirectory = layout.projectDirectory.dir('release')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    manifest {
        attributes 'Main-Class': 'constella.Launcher'
    }
    from sourceSets.main.output
    [configurations.universalJavafxLinux,
     configurations.universalJavafxWindows,
     configurations.universalJavafxMac].each { platformConfiguration ->
        from {
            platformConfiguration.collect { zipTree(it) }
        }
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
}

dependencies {
    implementation 'com.google.code.gson:gson:2.14.0'
    [universalJavafxLinux: 'linux',
     universalJavafxWindows: 'win',
     universalJavafxMac: 'mac-aarch64'].each { configurationName, platform ->
        add(configurationName, "org.openjfx:javafx-base:25.0.2:${platform}") { transitive = false }
        add(configurationName, "org.openjfx:javafx-graphics:25.0.2:${platform}") { transitive = false }
        add(configurationName, "org.openjfx:javafx-controls:25.0.2:${platform}") { transitive = false }
    }
    testImplementation platform('org.junit:junit-bom:5.14.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
}
