name: Gradle CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-package:
    name: Verify and package (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-latest
          - platform: Windows
            os: windows-latest
          - platform: macOS
            os: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Run checks and build platform JAR
        run: ./gradlew clean check releaseJar --no-daemon
      - name: Upload platform JAR
        uses: actions/upload-artifact@v7
        with:
          name: Constella-${{ matrix.platform }}
          path: release/*.jar
          if-no-files-found: error
          retention-days: 7
